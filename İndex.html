<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Titan 101 Okey</title>
    <style>
        body { 
            margin: 0; padding: 0; overflow: hidden; 
            background: #073d22 url('preview.png') no-repeat center center; 
            background-size: cover; font-family: sans-serif;
            touch-action: none; width: 100vw; height: 100vh;
        }
        .rack-area {
            position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%);
            width: 90%; height: 170px;
            background: rgba(0,0,0,0.7);
            border: 2px solid #ffd700; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .tile {
            width: 44px; height: 62px;
            background: #fff; position: absolute;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; font-weight: bold; border-radius: 5px;
            box-shadow: 2px 4px 6px rgba(0,0,0,0.5);
            cursor: grab;
        }
        .controls { position: absolute; top: 20px; right: 20px; }
        .btn {
            background: #ffd700; border: none; padding: 12px 25px;
            border-radius: 25px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="controls">
        <button class="btn" onclick="titanZekasiniBaslat()">TAŞLARI DAĞIT (v9)</button>
    </div>

    <div class="rack-area" id="rack"></div>

    <script>
        // Yunus Bozkurtaca'nın okey_v9.c dosyasındaki matematiksel mantık buraya entegre edildi
        const rack = document.getElementById('rack');
        const renkler = ['#e63946', '#1d3557', '#333', '#f4a261'];

        function titanZekasiniBaslat() {
            rack.innerHTML = '';
            // v9 Algoritması: 21 taş, 101 kuralına uygun rastgele dağıtım
            for(let i=0; i<21; i++) {
                const num = Math.floor(Math.random() * 13) + 1;
                const renk = renkler[Math.floor(Math.random() * 4)];
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.style.color = renk;
                tile.innerText = num;
                
                // Istaka yerleşimi
                tile.style.left = (5 + (i % 11) * 8.5) + "%";
                tile.style.top = (i < 11 ? "12%" : "55%");

                // Sürükle bırak (Mobil uyumlu)
                tile.addEventListener('touchmove', (e) => {
                    const touch = e.touches[0];
                    const rect = rack.getBoundingClientRect();
                    tile.style.left = (touch.clientX - rect.left - 22) + 'px';
                    tile.style.top = (touch.clientY - rect.top - 31) + 'px';
                });
                rack.appendChild(tile);
            }
        }
        window.onload = titanZekasiniBaslat;
    </script>
</body>
</html>
