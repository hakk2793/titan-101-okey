<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Titan Acode Test</title>
    <script src="https://sad.adsgram.ai/js/adstg.js"></script>
    <style>
        /* GÖRSELİN TIPKISININ AYNISI ATMOSFER */
        body {
            margin: 0; padding: 0;
            background: radial-gradient(circle at 50% 50%, #1a3a5a 0%, #050a12 70%, #000 100%);
            color: white; font-family: sans-serif;
            display: flex; flex-direction: column; align-items: center;
            height: 100vh; overflow: hidden;
        }

        /* ÜST PANEL: GÖRSELDEKİ GRİ/SİYAH TASARIM */
        .header {
            margin-top: 15px; width: 90%;
            background: linear-gradient(180deg, #333 0%, #111 100%);
            border: 2px solid #444; border-radius: 10px;
            padding: 10px; text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .balance-text { font-size: 1.4em; color: #FFD700; font-weight: bold; }

        /* ÇARK MEKANİZMASI VE DİŞLİLER */
        .engine-container {
            position: relative; margin: 40px auto;
            width: 330px; height: 330px;
            background: repeating-conic-gradient(from 0deg, #222 0deg 10deg, #333 10deg 20deg);
            border-radius: 50%; padding: 10px;
            box-shadow: 0 0 40px rgba(0, 210, 255, 0.2);
        }

        /* ALTIN OK */
        .arrow-indicator {
            position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent;
            border-top: 45px solid #FFD700; z-index: 100;
        }

        #wheel {
            width: 310px; height: 310px; border-radius: 50%;
            border: 8px solid #444;
            background: conic-gradient(
                #800 0deg 45deg, #111 45deg 90deg, #800 90deg 135deg, #111 135deg 180deg,
                #800 180deg 225deg, #111 225deg 270deg, #800 270deg 315deg, #111 315deg 360deg
            );
            transition: transform 5s cubic-bezier(0.1, 0, 0.1, 1);
            position: relative;
        }

        /* GÖRSELDEKİ X DEĞERLERİ */
        .val {
            position: absolute; width: 60px; top: 35px; left: calc(50% - 30px);
            font-weight: 900; font-size: 1.5em; color: #FFD700;
            text-shadow: 2px 2px 5px #000; transform-origin: center 120px; text-align: center;
        }

        /* BUTONLAR */
        .footer-btns { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; position: absolute; bottom: 30px; }
        .btn {
            width: 85%; padding: 16px; border-radius: 12px; font-weight: 900; font-size: 1.1em;
            border: none; cursor: pointer; text-transform: uppercase;
        }
        .btn-gold { background: linear-gradient(180deg, #FFD700, #B8860B); color: black; }
        .btn-blue { background: linear-gradient(180deg, #00d2ff, #0066cc); color: white; }
    </style>
</head>
<body>

    <div class="header">
        <div class="balance-text">💰 <span id="chips">950.000</span></div>
        <div style="color:#aaa; font-size:0.7em;">👑 VIP ÜRETİM: 10.000 ÇİP / SN</div>
    </div>

    <div class="engine-container">
        <div class="arrow-indicator"></div>
        <div id="wheel">
            <div class="val" style="transform: rotate(22.5deg)">X5</div>
            <div class="val" style="transform: rotate(67.5deg)">X3</div>
            <div class="val" style="transform: rotate(112.5deg)">X10</div>
            <div class="val" style="transform: rotate(157.5deg)">X0</div>
            <div class="val" style="transform: rotate(202.5deg)">X1</div>
            <div class="val" style="transform: rotate(247.5deg)">X15</div>
            <div class="val" style="transform: rotate(292.5deg)">X10</div>
            <div class="val" style="transform: rotate(337.5deg)">X1</div>
        </div>
    </div>

    <div class="footer-btns">
        <button class="btn btn-gold" onclick="spinNow()">ÇARKTI ÇEVİR (-50K)</button>
        <button class="btn btn-blue" onclick="watchAdNow()">📺 REKLAM İZLE (+100K)</button>
    </div>

    <script>
        let balance = 950000;
        let rotation = 0;
        const prizeList = [5, 3, 10, 0, 1, 15, 10, 1];

        function spinNow() {
            if(balance < 50000) return alert("Bakiye bitti!");
            balance -= 50000;
            updateDisplay();
            let winIdx = Math.floor(Math.random() * 8);
            rotation += (360 * 5) + (360 - (winIdx * 45 + 22.5));
            document.getElementById('wheel').style.transform = `rotate(${rotation}deg)`;
            setTimeout(() => {
                balance += (50000 * prizeList[winIdx]);
                updateDisplay();
            }, 5100);
        }

        function watchAdNow() {
            alert("Acode'da reklam test edilemez, sadece görünüm çalışır.");
            balance += 100000; updateDisplay();
        }

        function updateDisplay() { document.getElementById('chips').innerText = balance.toLocaleString(); }
    </script>
</body>
</html>
