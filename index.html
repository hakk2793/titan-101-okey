<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Titan Casino</title>
    <script src="https://sad.adsgram.ai/js/adstg.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; font-family: 'Arial', sans-serif;
            /* GÖRSELİ ARKA PLAN OLARAK SABİTLEDİK */
            background: url('https://r.resimlink.com/9vD_S1.png') no-repeat center center fixed;
            background-size: cover;
        }

        /* ÜST PANEL VERİLERİ */
        .ui-top {
            position: absolute; top: 20px; width: 100%;
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .stats {
            background: rgba(0,0,0,0.7); padding: 5px 20px; border-radius: 20px;
            border: 1px solid #FFD700; color: white; font-weight: bold; font-size: 1.2em;
        }

        /* ÇARK MEKANİZMASI - GÖRSELDEKİ ÇARKIN ÜSTÜNE TAM OTURUR */
        .wheel-box {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 320px; height: 320px;
        }

        #wheel {
            width: 100%; height: 100%; border-radius: 50%;
            /* Görseldeki renkleri ve dilimleri simüle eder */
            background: conic-gradient(
                #8b0000 0deg 45deg, #111 45deg 90deg, #8b0000 90deg 135deg, #111 135deg 180deg,
                #8b0000 180deg 225deg, #111 225deg 270deg, #8b0000 270deg 315deg, #111 315deg 360deg
            );
            border: 10px solid rgba(255,215,0,0.3);
            transition: transform 5s cubic-bezier(0.1, 0, 0.1, 1);
            position: relative;
        }

        /* X DEĞERLERİ - GÖRSELDEKİ DİZİLİM */
        .val {
            position: absolute; width: 60px; top: 30px; left: calc(50% - 30px);
            font-weight: 900; font-size: 1.5em; color: #FFD700;
            text-shadow: 2px 2px 4px #000; transform-origin: center 130px; text-align: center;
        }

        /* OK İŞARETİ */
        .pointer {
            position: absolute; top: -30px; left: 50%; transform: translateX(-50%);
            width: 40px; height: 50px; background: #FFD700;
            clip-path: polygon(50% 100%, 0% 0%, 100% 0%); z-index: 10;
        }

        /* BUTONLAR - GÖRSELDEKİ TASARIM */
        .ui-bottom {
            position: absolute; bottom: 30px; width: 100%;
            display: flex; flex-direction: column; align-items: center; gap: 15px;
        }
        .btn {
            width: 80%; padding: 15px; border-radius: 10px; font-weight: 900;
            border: none; cursor: pointer; text-transform: uppercase;
        }
        .btn-spin { background: linear-gradient(#FFD700, #B8860B); color: black; }
        .btn-ads { background: linear-gradient(#00f2ff, #0066cc); color: white; }
    </style>
</head>
<body>

    <div class="ui-top">
        <div class="stats">💰 <span id="chips">950.000</span> &nbsp;&nbsp; 💎 15</div>
        <div style="color:#FFD700; font-size:0.8em;">👑 VIP ÜRETİM: 10.000 ÇİP / SN</div>
    </div>

    <div class="wheel-box">
        <div class="pointer"></div>
        <div id="wheel">
            <div class="val" style="transform: rotate(22.5deg)">X5</div>
            <div class="val" style="transform: rotate(67.5deg)">X3</div>
            <div class="val" style="transform: rotate(112.5deg)">X10</div>
            <div class="val" style="transform: rotate(157.5deg)">X0</div>
            <div class="val" style="transform: rotate(202.5deg)">X1</div>
            <div class="val" style="transform: rotate(247.5deg)">X15</div>
            <div class="val" style="transform: rotate(292.5deg)">X10</div>
            <div class="val" style="transform: rotate(337.5deg)">X1</div>
        </div>
    </div>

    <div class="ui-bottom">
        <button class="btn btn-spin" onclick="spin()">ÇARKTI ÇEVİR (-50K)</button>
        <button class="btn btn-ads" onclick="ads()">📺 REKLAM İZLE (+100K)</button>
    </div>

    <script>
        let balance = 950000;
        let rot = 0;
        const rewards = [5, 3, 10, 0, 1, 15, 10, 1];

        function spin() {
            if(balance < 50000) return alert("Bakiye bitti!");
            balance -= 50000;
            update();
            let target = Math.floor(Math.random() * 8);
            rot += (360 * 5) + (360 - (target * 45 + 22.5));
            document.getElementById('wheel').style.transform = `rotate(${rot}deg)`;
            setTimeout(() => {
                balance += (50000 * rewards[target]);
                update();
            }, 5100);
        }

        function ads() {
            const AdController = window.Adsgram.init({ blockId: "22286" });
            AdController.show().then(() => { balance += 100000; update(); });
        }

        function update() { document.getElementById('chips').innerText = balance.toLocaleString(); }
    </script>
</body>
</html>
