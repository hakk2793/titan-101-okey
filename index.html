<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>101 Titanik</title>
    <style>
        body { background-color: #001a33; color: white; font-family: sans-serif; margin: 0; overflow: hidden; }
        #game-table { 
            width: 100vw; height: 100vh; 
            background: radial-gradient(circle, #004d4d 0%, #001a1a 100%); 
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
        }
        .header { width: 100%; padding: 10px; display: flex; justify-content: space-between; background: rgba(0,0,0,0.5); }
        .logo { font-weight: bold; color: #ffcc00; font-size: 20px; text-shadow: 2px 2px #000; }
        
        /* Istaka ve Taşlar */
        .istaka { 
            width: 95%; height: 120px; background: #3d2616; border: 4px solid #5d3a22; 
            border-radius: 10px; margin-bottom: 20px; display: grid; 
            grid-template-columns: repeat(11, 1fr); gap: 2px; padding: 5px;
        }
        .tas { 
            background: #fdfdfd; color: black; border-radius: 4px; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: bold; font-size: 18px; border-bottom: 3px solid #ccc;
        }
        
        /* Para Kazanma Butonu */
        .ads-button { 
            background: linear-gradient(to bottom, #ffcc00, #ff9900); 
            color: black; border: none; padding: 15px 30px; 
            border-radius: 50px; font-weight: bold; font-size: 18px;
            box-shadow: 0 5px #cc7a00; cursor: pointer;
        }
        .ads-button:active { transform: translateY(3px); box-shadow: 0 2px #cc7a00; }
    </style>
</head>
<body>

<div id="game-table">
    <div class="header">
        <div class="logo">🚢 101 TİTANİK</div>
        <div id="balance">KAZANÇ: 0.00 TL</div>
    </div>

    <div style="text-align: center;">
        <p>Gemi Kaptan Bekliyor...</p>
        <button class="ads-button" onclick="izleKazan()">REKLAM İZLE & TAŞ DAĞIT</button>
    </div>

    <div class="istaka" id="istaka">
        </div>
</div>

<script>
    function izleKazan() {
        alert("Video Reklam Yükleniyor... (Burada AdMob/Unity Ads çalışacak)");
        // Para kazanma mantığı buraya eklenecek
        dagit();
    }

    function dagit() {
        const istaka = document.getElementById('istaka');
        istaka.innerHTML = '';
        for(let i=0; i<22; i++) {
            let num = Math.floor(Math.random() * 13) + 1;
            let colors = ['red', 'blue', 'black', 'orange'];
            let color = colors[Math.floor(Math.random() * colors.length)];
            istaka.innerHTML += `<div class="tas" style="color:${color}">${num}</div>`;
        }
    }
    // İlk açılışta taşları diz
    dagit();
</script>

</body>
</html>
