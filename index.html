<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>101 Titanik - v1.0</title>
    <style>
        body { background-color: #001a33; color: white; font-family: sans-serif; margin: 0; overflow: hidden; }
        #game-table { 
            width: 100vw; height: 100vh; 
            background: radial-gradient(circle, #004d4d 0%, #001a1a 100%); 
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
        }
        .header { width: 100%; padding: 5px; display: flex; justify-content: space-between; background: rgba(0,0,0,0.7); font-size: 12px; }
        
        /* 4 Kişilik Masa Düzeni */
        .player-slot { width: 80px; height: 80px; background: rgba(0,0,0,0.3); border: 1px solid #ffcc00; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; }
        .middle-area { display: flex; width: 100%; justify-content: space-around; align-items: center; flex-grow: 1; }
        
        /* Istaka ve Butonlar */
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; width: 95%; margin-bottom: 5px; }
        button { background: linear-gradient(#444, #222); color: #ffcc00; border: 1px solid #ffcc00; padding: 8px; border-radius: 5px; font-weight: bold; font-size: 12px; }
        
        .istaka { 
            width: 95%; height: 110px; background: #3d2616; border: 3px solid #5d3a22; 
            border-radius: 8px; margin-bottom: 10px; display: grid; 
            grid-template-columns: repeat(11, 1fr); gap: 2px; padding: 4px;
        }
        .tas { background: #fdfdfd; color: black; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-weight: bold; border-bottom: 2px solid #ccc; font-size: 16px; }
    </style>
</head>
<body>

<div id="game-table">
    <div class="header">
        <div class="logo">🚢 101 TİTANİK</div>
        <div class="player-slot"><span>Selim</span><br><span>Puan: 0</span></div>
        <div id="balance">KAZANÇ: 0.00 TL</div>
    </div>

    <div class="middle-area">
        <div class="player-slot"><span>Ömer</span><br><span>Puan: 0</span></div>
        <div id="center-deck" style="text-align:center;">
            <div style="font-size:30px;">🎴</div>
            <button onclick="tasAl()">TAŞ AL</button>
        </div>
        <div class="player-slot"><span>Aleyna</span><br><span>Puan: 0</span></div>
    </div>

    <div class="controls">
        <button onclick="seriAc()">SERİ AÇ</button>
        <button onclick="ciftAc()">ÇİFT AÇ</button>
        <button onclick="tasAt()">TAŞ AT</button>
        <button onclick="islerAt()">İŞLER AT</button>
        <button onclick="geriTopla()" style="grid-column: span 2; background: #600;">GERİ TOPLA / CEZA</button>
    </div>

    <div class="istaka" id="istaka"></div>
</div>

<script>
    function tasAl() { alert("Yerden taş alındı."); }
    function seriAc() { alert("101 Sayısı Kontrol Ediliyor..."); }
    function ciftAc() { alert("5 Çift Kontrol Ediliyor..."); }
    function tasAt() { alert("Lütfen atılacak taşı seçin."); }
    function islerAt() { alert("İşler taşlar masaya dağıtılıyor..."); }
    function geriTopla() { alert("Hatalı el! Taşlar toplanıyor ve 101 ceza eklendi."); }

    function dagit() {
        const istaka = document.getElementById('istaka');
        istaka.innerHTML = '';
        for(let i=0; i<22; i++) {
            let num = Math.floor(Math.random() * 13) + 1;
            let colors = ['red', 'blue', 'black', 'orange'];
            let color = colors[Math.floor(Math.random() * colors.length)];
            istaka.innerHTML += `<div class="tas" style="color:${color}">${num}</div>`;
        }
    }
    dagit();
</script>

</body>
</html>
