<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>101 TİTANİK - Ultimate Casino & Okey</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Goldman:wght@400;700&family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --titanic-gold: #D4AF37;
            --ocean-blue: #002347;
            --deep-dark: #000c18;
            --neon-green: #39FF14;
            --vip-pink: #FF007F;
        }

        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Ubuntu', sans-serif; background: var(--deep-dark); color: white; }

        /* ARKA PLAN VİDEO/GÖRSEL EFEKTİ */
        .master-container { position: relative; width: 100%; height: 100%; }
        .full-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); z-index: 10; }
        .hidden { transform: translateX(100%); pointer-events: none; }

        /* --- 1. SPLASH / GİRİŞ --- */
        #splash { background: linear-gradient(to bottom, rgba(0,0,0,0.3), var(--deep-dark)), url('https://images.unsplash.com/photo-1500077423678-25eead48513a?q=80&w=2070'); background-size: cover; z-index: 100; align-items: center; justify-content: center; }
        .logo-area { text-align: center; animation: float 3s infinite ease-in-out; }
        .main-title { font-family: 'Cinzel Decorative', serif; font-size: 4.5em; color: var(--titanic-gold); text-shadow: 0 0 30px #000, 0 0 10px var(--titanic-gold); margin: 0; }
        .login-box { margin-top: 40px; display: flex; flex-direction: column; gap: 15px; }
        .btn-grad { background-image: linear-gradient(to right, #D4AF37 0%, #F2D388 51%, #D4AF37 100%); padding: 15px 45px; text-align: center; text-transform: uppercase; transition: 0.5s; background-size: 200% auto; color: #000; font-weight: bold; border-radius: 50px; cursor: pointer; border: none; width: 280px; }
        .btn-grad:hover { background-position: right center; color: #fff; text-decoration: none; }

        /* --- 2. PROFESYONEL LOBİ (Referans: Fun 101) --- */
        #lobby { background: var(--ocean-blue); transform: translateX(0); }
        .top-nav { height: 60px; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 2px solid var(--titanic-gold); }
        .user-stats { display: flex; gap: 20px; align-items: center; }
        .stat-item { background: rgba(255,255,255,0.1); padding: 5px 15px; border-radius: 20px; border: 1px solid var(--titanic-gold); display: flex; align-items: center; gap: 10px; }
        .stat-item i { color: var(--titanic-gold); }

        .lobby-main { flex: 1; display: flex; padding: 20px; gap: 20px; }
        /* Sol Menü: Yan Oyunlar */
        .side-menu { width: 120px; display: flex; flex-direction: column; gap: 15px; }
        .side-btn { background: rgba(0,0,0,0.5); border: 1px solid #222; border-radius: 12px; height: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; }
        .side-btn:hover { background: var(--titanic-gold); color: #000; transform: scale(1.05); }
        .side-btn span { font-size: 0.7em; margin-top: 5px; font-weight: bold; }

        /* Oda Seçimi Izgarası */
        .room-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; overflow-y: auto; padding-right: 10px; }
        .room-card { height: 250px; background: linear-gradient(145deg, #001f3f, #000); border: 2px solid var(--titanic-gold); border-radius: 20px; position: relative; overflow: hidden; cursor: pointer; transition: 0.4s; }
        .room-card:hover { transform: translateY(-10px); box-shadow: 0 0 30px rgba(212,175,55,0.4); }
        .room-card img { width: 100%; height: 150px; object-fit: cover; opacity: 0.7; }
        .room-info { padding: 10px; text-align: center; }
        .room-bet { color: var(--neon-green); font-size: 1.5em; font-weight: bold; font-family: 'Goldman', cursive; }
        .room-badge { position: absolute; top: 10px; right: 10px; background: red; color: white; padding: 5px 10px; border-radius: 8px; font-size: 0.8em; font-weight: bold; }

        /* --- 3. YAN OYUNLAR (SLOT & AT YARIŞI) --- */
        .game-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 500; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .slot-machine { width: 400px; height: 300px; background: #333; border: 10px solid var(--titanic-gold); border-radius: 20px; display: flex; gap: 10px; padding: 20px; }
        .slot-reel { flex: 1; background: #fff; height: 100%; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 4em; color: #000; overflow: hidden; }

        /* --- 4. 101 OKEY MASASI (Referans: Fun 101) --- */
        #game-table { background: #004d4d; }
        .table-center { flex: 1; display: grid; grid-template-columns: repeat(11, 1fr); gap: 2px; padding: 10px; background: rgba(0,0,0,0.2); border: 1px solid #006666; margin: 10px; border-radius: 15px; }
        .cell { background: rgba(255,255,255,0.02); aspect-ratio: 0.7; border: 0.1px solid rgba(255,255,255,0.05); }
        .istaka-area { height: 160px; background: #2b1d0e; border-top: 5px solid var(--titanic-gold); display: flex; flex-direction: column; align-items: center; padding: 10px; }
        .istaka-slots { display: flex; gap: 5px; }
        .tile { width: 38px; height: 55px; background: #eee; border-radius: 5px; display: flex; align-items: center; justify-content: center; color: #000; font-weight: bold; font-size: 1.2em; box-shadow: 2px 2px 5px rgba(0,0,0,0.5); cursor: pointer; }

        /* ANIMATIONS */
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
    </style>
</head>
<body>

<div class="master-container">

    <div id="splash" class="full-screen">
        <div class="logo-area">
            <h1 class="main-title">101 TİTANİK</h1>
            <p style="letter-spacing: 5px; color: var(--titanic-gold);">CASINO & RESORT</p>
        </div>
        <div class="login-box">
            <button class="btn-grad" onclick="app.login()">FACEBOOK İLE BAĞLAN</button>
            <button class="btn-grad" style="background-image: linear-gradient(to right, #333, #555)" onclick="app.login()">MİSAFİR GİRİŞİ</button>
        </div>
    </div>

    <div id="lobby" class="full-screen hidden">
        <div class="top-nav">
            <div class="user-stats">
                <div class="stat-item"><span>💰</span><span id="u-chips">500.000</span></div>
                <div class="stat-item"><span>💎</span><span id="u-diamonds">25</span></div>
                <div class="stat-item" style="border-color: var(--vip-pink);"><span>👑</span><span id="u-vip">VIP 1</span></div>
            </div>
            <div class="stat-item" onclick="app.toggleMarket()" style="cursor:pointer"><span>🛒</span> MARKET</div>
        </div>

        <div class="lobby-main">
            <div class="side-menu">
                <div class="side-btn" onclick="app.openMiniGame('slot')">🎰<span>SLOTLAR</span></div>
                <div class="side-btn" onclick="app.openMiniGame('horse')">🐎<span>AT YARIŞI</span></div>
                <div class="side-btn" onclick="app.openMiniGame('redblue')">⚔️<span>DÜELLO</span></div>
                <div class="side-btn" style="margin-top:auto" onclick="app.watchAd()">📺<span>İZLE-KAZAN</span></div>
            </div>

            <div class="room-grid" id="room-list">
                </div>
        </div>
    </div>

    <div id="game-table" class="full-screen hidden">
        <div class="top-nav">
            <button onclick="app.exitGame()" style="background:none; border:none; color:white; font-size:1.5em">🔙</button>
            <div id="active-room-name">USTA ODASI</div>
            <div class="user-stats">
                <div class="stat-item">💰 <span id="game-chips">500K</span></div>
            </div>
        </div>
        
        <div class="table-center" id="board-grid">
            </div>

        <div class="istaka-area">
            <div class="istaka-slots" id="my-hand">
                </div>
            <div style="margin-top:15px; display:flex; gap:10px;">
                <button class="btn-grad" style="width:120px; padding:10px;" onclick="app.check101()">101 AÇ</button>
                <button class="btn-grad" style="width:120px; padding:10px; background-image:linear-gradient(to right, #600, #a00)" onclick="app.drawTile()">TAŞ ÇEK</button>
            </div>
        </div>
    </div>

    <div id="slot-overlay" class="game-overlay">
        <h2 style="color:var(--titanic-gold)">TİTANİK JACKPOT</h2>
        <div class="slot-machine">
            <div class="slot-reel" id="r1">7</div>
            <div class="slot-reel" id="r2">7</div>
            <div class="slot-reel" id="r3">7</div>
        </div>
        <button class="btn-grad" style="margin-top:20px" onclick="app.spinSlot()">ÇEVİR (5000 💰)</button>
        <button onclick="app.closeMiniGame('slot')" style="margin-top:20px; color:white; background:none; border:none">❌ KAPAT</button>
    </div>

</div>

<script>
    // --- TİTANİK ENGINE (Geleceğin 10.000 Satırlık Motoru) ---
    const app = {
        chips: 500000,
        diamonds: 25,
        vip: 1,
        
        rooms: [
            { id: 1, name: "Acemi Güvertesi", bet: "20.000", badge: "HIZLI", img: "https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?q=80&w=2070" },
            { id: 2, name: "Kalfa Salonu", bet: "100.000", badge: "POPÜLER", img: "https://images.unsplash.com/photo-1596484552834-6a58f850e0a1?q=80&w=2070" },
            { id: 3, name: "Kaptan Köşkü", bet: "500.000", badge: "VIP", img: "https://images.unsplash.com/photo-1510076857177-7470076d4098?q=80&w=2072" },
            { id: 4, name: "Kral Dairesi", bet: "2.5M", badge: "EFSANE", img: "https://images.unsplash.com/photo-1614028674026-a65e31bfd27c?q=80&w=2070" }
        ],

        init: function() {
            this.renderRooms();
            this.createBoard();
        },

        renderRooms: function() {
            const grid = document.getElementById('room-list');
            this.rooms.forEach(room => {
                grid.innerHTML += `
                    <div class="room-card" onclick="app.joinGame('${room.name}')">
                        <span class="room-badge">${room.badge}</span>
                        <img src="${room.img}">
                        <div class="room-info">
                            <h3>${room.name}</h3>
                            <div class="room-bet">${room.bet} 💰</div>
                        </div>
                    </div>
                `;
            });
        },

        createBoard: function() {
            const board = document.getElementById('board-grid');
            for(let i=0; i<77; i++) {
                board.innerHTML += `<div class="cell"></div>`;
            }
        },

        login: function() {
            document.getElementById('splash').style.transform = "translateY(-100%)";
            document.getElementById('lobby').classList.remove('hidden');
            this.updateUI();
        },

        joinGame: function(name) {
            document.getElementById('active-room-name').innerText = name.toUpperCase();
            document.getElementById('lobby').classList.add('hidden');
            document.getElementById('game-table').classList.remove('hidden');
            this.renderHand();
        },

        exitGame: function() {
            document.getElementById('game-table').classList.add('hidden');
            document.getElementById('lobby').classList.remove('hidden');
        },

        renderHand: function() {
            const hand = document.getElementById('my-hand');
            hand.innerHTML = '';
            const colors = ['#d32f2f', '#1976d2', '#212121', '#f57c00'];
            for(let i=0; i<22; i++) {
                let n = Math.floor(Math.random()*13)+1;
                let c = colors[Math.floor(Math.random()*4)];
                hand.innerHTML += `<div class="tile" style="color:${c}">${n}</div>`;
            }
        },

        openMiniGame: function(type) {
            if(type === 'slot') document.getElementById('slot-overlay').style.display = 'flex';
            else alert(type + " yakında Titanik'te!");
        },

        closeMiniGame: function(type) {
            document.getElementById('slot-overlay').style.display = 'none';
        },

        spinSlot: function() {
            if(this.chips < 5000) return alert("Bakiye yetersiz!");
            this.chips -= 5000;
            this.updateUI();
            
            const symbols = ["🍒", "🍋", "7", "💎", "⚓"];
            const r1 = symbols[Math.floor(Math.random()*symbols.length)];
            const r2 = symbols[Math.floor(Math.random()*symbols.length)];
            const r3 = symbols[Math.floor(Math.random()*symbols.length)];
            
            document.getElementById('r1').innerText = r1;
            document.getElementById('r2').innerText = r2;
            document.getElementById('r3').innerText = r3;

            if(r1 === r2 && r2 === r3) {
                alert("TEBRİKLER! JACKPOT KAZANDIN! +50.000 💰");
                this.chips += 50000;
                this.updateUI();
            }
        },

        watchAd: function() {
            alert("📽️ Reklam izleniyor... VIP Yumurta hızı arttı!");
            this.chips += 10000;
            this.updateUI();
        },

        updateUI: function() {
            document.getElementById('u-chips').innerText = this.chips.toLocaleString();
            document.getElementById('game-chips').innerText = this.chips.toLocaleString();
        },

        check101: function() {
            alert("🛡️ HİLE SAVAR: Elin toplamı 101 değil, seri açamazsın!");
        },

        drawTile: function() {
            alert("Yerden taş çekildi!");
        }
    };

    app.init();
</script>

</body>
</html>
