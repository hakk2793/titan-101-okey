<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>101 Titanik - Kaptan v2.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #FFD700; --blue: #003366; --dark: #001a33; --green: #388E3C;
        }
        body { margin: 0; overflow: hidden; font-family: 'Open Sans', sans-serif; background: var(--dark); color: white; }
        .full-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background-size: cover; background-position: center; z-index: 100; transition: 0.5s; }
        .hidden { display: none !important; }

        /* SPLASH & LOGIN */
        #splash-screen { background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1500077423678-25eead48513a?auto=format&fit=crop&q=80&w=2070'); }
        .title { font-family: 'Cinzel Decorative', serif; font-size: 3.5em; color: var(--gold); text-shadow: 0 0 20px #000; margin-bottom: 20px; }
        .btn-login { background: rgba(255,215,0,0.2); border: 2px solid var(--gold); color: white; padding: 15px 40px; border-radius: 50px; font-weight: bold; cursor: pointer; margin: 10px; font-size: 1.1em; width: 250px; }

        /* LOBBY */
        #lobby-screen { background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1524231757912-21f4fe3a7200?auto=format&fit=crop&q=80&w=2071'); justify-content: flex-start; padding-top: 20px; }
        .header-bar { width: 95%; display: flex; justify-content: space-between; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 15px; border: 1px solid var(--gold); margin-bottom: 20px; }
        .room-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; width: 95%; overflow-y: auto; padding: 10px; }
        .room-card { background: linear-gradient(145deg, #1a2a3a, #0a1a2a); border: 2px solid var(--gold); border-radius: 15px; padding: 15px; text-align: center; cursor: pointer; position: relative; }
        .room-badge { position: absolute; top: -10px; right: -10px; background: #e91e63; padding: 4px 8px; border-radius: 8px; font-size: 0.7em; }

        /* MARKET */
        #market-screen { background: rgba(0,0,0,0.9); z-index: 500; }
        .market-box { width: 90%; height: 85%; background: #111; border: 2px solid var(--gold); border-radius: 20px; display: flex; overflow: hidden; }
        .market-nav { width: 120px; background: #222; display: flex; flex-direction: column; }
        .market-nav button { padding: 20px 10px; background: none; border: none; color: white; border-bottom: 1px solid #333; cursor: pointer; }
        .market-nav button.active { background: var(--blue); color: var(--gold); }
        .market-grid { flex-grow: 1; padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 15px; overflow-y: auto; }
        .market-item { background: #222; padding: 10px; border-radius: 10px; text-align: center; border: 1px solid #444; }

        /* OYUN MASASI */
        #game-screen { background: radial-gradient(circle, #004d4d, #001a1a); }
        .board { width: 95%; height: 50%; border: 2px solid #006666; display: grid; grid-template-columns: repeat(11, 1fr); background: rgba(0,0,0,0.3); border-radius: 10px; }
        .istaka { width: 98%; height: 120px; background: #2b1d0e; border: 4px solid #4a3219; border-radius: 10px; display: flex; flex-wrap: wrap; gap: 4px; padding: 5px; margin-top: 10px; }
        .tas { width: 35px; height: 50px; background: #eee; color: black; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2em; box-shadow: 2px 2px 5px rgba(0,0,0,0.5); }
        .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; width: 95%; margin-top: 10px; }
        .controls button { padding: 12px; border: none; border-radius: 5px; background: var(--blue); color: white; font-weight: bold; }
        
        /* BONUS */
        .bonus-modal { background: rgba(0,0,0,0.95); z-index: 1000; }
        .bonus-card { background: #1a2a3a; border: 3px solid var(--gold); padding: 30px; border-radius: 20px; text-align: center; }
    </style>
</head>
<body>

    <div id="splash-screen" class="full-screen">
        <h1 class="title">101 TİTANİK</h1>
        <button class="btn-login" onclick="girisYap()">Misafir Girişi</button>
        <button class="btn-login" style="border-color:#4267B2" onclick="girisYap()">Facebook Giriş</button>
    </div>

    <div id="lobby-screen" class="full-screen hidden">
        <div class="header-bar">
            <span>💰 <span id="chips">250K</span></span>
            <span>💎 <span id="diamonds">10</span></span>
            <span onclick="marketAc()" style="cursor:pointer">🛒 MARKET</span>
        </div>
        <div class="room-container" id="rooms"></div>
        <button class="btn-login" style="background:var(--green); margin-top:20px;" onclick="hizliBaslat()">HIZLI BAŞLAT</button>
    </div>

    <div id="market-screen" class="full-screen hidden">
        <div class="market-box">
            <div class="market-nav">
                <button class="active">ÇİP</button>
                <button onclick="reklamIzle()">📺 REKLAM</button>
                <button onclick="showScreen('lobby-screen')" style="margin-top:auto; background:#600">KAPAT</button>
            </div>
            <div class="market-grid">
                <div class="market-item"><h4>5M Çip</h4><p>49.99 TL</p><button>AL</button></div>
                <div class="market-item"><h4>20M Çip</h4><p>149.99 TL</p><button>AL</button></div>
                <div class="market-item"><h4>100M Çip</h4><p>499.99 TL</p><button>AL</button></div>
            </div>
        </div>
    </div>

    <div id="game-screen" class="full-screen hidden">
        <div class="header-bar">
            <span onclick="showScreen('lobby-screen')">🔙 ÇIK</span>
            <span id="room-name">Acemi Odası</span>
            <span>💰 <span id="game-chips">250K</span></span>
        </div>
        <div class="board" id="board"></div>
        <div class="controls">
            <button onclick="tasAl()">TAŞ AL</button>
            <button onclick="seriAc()">SERİ AÇ</button>
            <button onclick="tasAt()">TAŞ AT</button>
            <button onclick="ciftAc()">ÇİFT AÇ</button>
            <button onclick="seriDiz()">DİZ</button>
            <button style="background:#600">CEZA</button>
        </div>
        <div class="istaka" id="istaka"></div>
    </div>

    <div id="bonus-screen" class="full-screen hidden bonus-modal">
        <div class="bonus-card">
            <h2 style="color:var(--gold)">KAPTANIN HEDİYESİ</h2>
            <p>Günlük giriş bonusunu topladın!</p>
            <h1 style="font-size:3em">+10.000 Çip</h1>
            <button class="btn-login" onclick="bonusKapat()">AL VE BAŞLA</button>
        </div>
    </div>

<script>
    let bakiye = 250000;
    const odaListesi = [
        {ad: 'Acemi', bahis: 20000, badge: 'Yeni'},
        {ad: 'Kalfa', bahis: 100000, badge: 'Popüler'},
        {ad: 'Usta', bahis: 500000, badge: 'VIP'},
        {ad: 'Efsane', bahis: 2000000, badge: 'Kral'}
    ];

    function girisYap() { showScreen('bonus-screen'); }
    function bonusKapat() { bakiye += 10000; guncelleUI(); showScreen('lobby-screen'); odalariKur(); }

    function showScreen(id) {
        document.querySelectorAll('.full-screen').forEach(s => s.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }

    function odalariKur() {
        const c = document.getElementById('rooms');
        c.innerHTML = '';
        odaListesi.forEach(o => {
            c.innerHTML += `<div class="room-card" onclick="oyunaGir('${o.ad}', ${o.bahis})">
                <span class="room-badge">${o.badge}</span>
                <h3>${o.ad}</h3>
                <p style="color:#0f0; font-weight:bold">${formatNum(o.bahis)}</p>
            </div>`;
        });
    }

    function oyunaGir(ad, bahis) {
        if(bakiye < bahis) return alert("Çip yetersiz kaptan!");
        document.getElementById('room-name').innerText = ad + " Odası";
        showScreen('game-screen');
        tasDagit();
        const b = document.getElementById('board');
        b.innerHTML = '';
        for(let i=0; i<77; i++) b.innerHTML += '<div style="border:0.1px solid #111"></div>';
    }

    function tasDagit() {
        const ist = document.getElementById('istaka');
        ist.innerHTML = '';
        const clr = ['#d32f2f', '#1976d2', '#212121', '#f57c00'];
        for(let i=0; i<22; i++) {
            let n = Math.floor(Math.random()*13)+1;
            let c = clr[Math.floor(Math.random()*4)];
            ist.innerHTML += `<div class="tas" style="color:${c}">${n}</div>`;
        }
    }

    function reklamIzle() {
        alert("📽️ Reklam izlendi! +5000 Çip.");
        bakiye += 5000;
        guncelleUI();
    }

    function guncelleUI() {
        document.getElementById('chips').innerText = formatNum(bakiye);
        document.getElementById('game-chips').innerText = formatNum(bakiye);
    }

    function formatNum(n) {
        if(n >= 1000000) return (n/1000000).toFixed(1) + 'M';
        if(n >= 1000) return (n/1000).toFixed(0) + 'K';
        return n;
    }

    function marketAc() { showScreen('market-screen'); }
    function tasAl() { alert("Yerden taş aldın."); }
    function seriAc() { alert("Hile Savar: El puanın 101 değil!"); }
    function tasAt() { alert("Taş atıldı."); }
    function ciftAc() { alert("Hile Savar: En az 5 çiftin olmalı!"); }
    function seriDiz() { tasDagit(); }
</script>
</body>
</html>
