<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { border: 5px solid #D4AF37; border-radius: 15px; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
    </style>
</head>
<body>
<script>
    // 101 TİTANİK PROFESYONEL OYUN AYARLARI
    const config = {
        type: Phaser.AUTO,
        width: 1280,
        height: 720,
        backgroundColor: '#004d4d',
        parent: 'phaser-example',
        scene: { preload: preload, create: create }
    };

    const game = new Phaser.Game(config);

    function preload() {
        // Burada senin o fotoğraflardaki lüks masayı ve taşları yüklüyoruz
        this.load.image('table', 'https://labs.phaser.io/assets/skies/big-clouds.png'); // Örnek arka plan
        this.load.image('tas', 'https://via.placeholder.com/60x85/ffffff/000000?text=13'); // Profesyonel Taş
    }

    function create() {
        // Masayı Ser
        let table = this.add.image(640, 360, 'table').setDisplaySize(1280, 720).setAlpha(0.3);
        
        this.add.text(500, 20, '101 TİTANİK - ROYAL TABLE', { font: 'bold 40px Cinzel', fill: '#D4AF37' });

        // Iskataya 22 taş diz ve SÜRÜKLENEBİLİR yap
        for(let i=0; i<22; i++) {
            let x = 200 + (i * 45);
            let y = 600;
            if(i > 10) { x = 200 + ((i-11) * 45); y = 680; }

            let tas = this.add.sprite(x, y, 'tas').setInteractive();
            this.input.setDraggable(tas);
            
            // Taşın üstüne numara yaz
            this.add.text(x-10, y-20, Math.floor(Math.random()*13)+1, { font: '24px Arial', fill: '#000' });
        }

        // SÜRÜKLEME MANTIĞI (İşte bu gerçek oyun hissi!)
        this.input.on('drag', function (pointer, gameObject, dragX, dragY) {
            gameObject.x = dragX;
            gameObject.y = dragY;
        });
    }
</script>
</body>
</html>
