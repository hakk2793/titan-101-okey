<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Titan Casino</title>
    <script src="https://sad.adsgram.ai/js/adstg.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; 
            /* GÖRSELİ ARKA PLAN OLARAK SABİTLEDİK */
            background: url('https://r.resimlink.com/9vD_S1.png') no-repeat center center fixed;
            background-size: cover;
            background-color: #000;
        }

        /* ÜST PANEL */
        .ui-top {
            position: absolute; top: 15px; width: 100%;
            display: flex; flex-direction: column; align-items: center; gap: 5px;
            z-index: 100;
        }
        .stats {
            background: rgba(0,0,0,0.8); padding: 8px 25px; border-radius: 15px;
            border: 2px solid #FFD700; color: white; font-weight: bold; font-size: 1.3em;
        }

        /* ÇARK MEKANİZMASI */
        .wheel-box {
            position: absolute; top: 52%; left: 50%;
            transform: translate(-50%, -50%);
            width: 310px; height: 310px;
        }

        #wheel {
            width: 100%; height: 100%; border-radius: 50%;
            background: conic-gradient(
                #8b0000 0deg 45deg, #111 45deg 90deg, #8b0000 90deg 135deg, #111 135deg 180deg,
                #8b0000 180deg 225deg, #111 225deg 270deg, #8b0000 270deg 315deg, #111 315deg 360deg
            );
            border: 8px solid rgba(255,215,0,0.4);
            transition: transform 5s cubic-bezier(0.1, 0, 0.1, 1);
            position: relative;
            box-shadow: 0 0 30px #000;
        }

        .val {
            position: absolute; width: 60px; top: 30px; left: calc(50% - 30px);
            font-weight: 900; font-size: 1.5em; color: #FFD700;
            text-shadow: 2px 2px 5px #000; transform-origin: center 125px; text-align: center;
        }

        .pointer {
            position: absolute; top: -35px; left: 50%; transform: translateX(-50%);
            width: 45px; height: 55px; background: #FFD700;
            clip-path: polygon(50% 100%, 0% 0%, 100% 0%); z-index: 10;
            filter: drop-shadow(0 0 10px #FFD700);
        }

        /* ALT PANEL */
        .ui-bottom {
            position: absolute; bottom: 25px; width: 100%;
            display: flex; flex-direction: column; align-items: center; gap: 12px;
        }
        .btn {
            width: 85%; padding: 16px; border-radius: 12px; font-weight: 900;
            border: none; cursor: pointer; text-transform: uppercase; font-size: 1.1em;
        }
        .btn-spin { background: linear-gradient(#FFD700, #B8860B); color: #000; }
        .btn-ads { background: linear-gradient(#00f2ff, #0066cc); color: #fff; }
    </style>
</head>
<body>

    <div class="ui-top">
        <div class="stats">💰 <span id="chips">950.000</span> &nbsp;&nbsp; 💎 15</div>
        <div style="color:#FFD700; font-size:0.8em; font-weight:bold;">👑 VIP ÜRETİM: 10.000 ÇİP / SN</div>
    </div>

    <div class="wheel-box">
        <div class="pointer"></div>
        <div id="wheel">
            <div class="val" style="transform: rotate(22.5deg)">X5</div>
            <div class="val" style="transform: rotate(67.5deg)">X3</div>
            <div class="val" style="transform: rotate(112.5deg)">X10</div>
            <div class="val" style="transform: rotate(157.5deg)">X0</div>
            <div class="val" style="transform: rotate(202.5deg)">X1</div>
            <div class="val" style="transform: rotate(247.5deg)">X15</div>
            <div class="val" style="transform: rotate(292.5deg)">X10</div>
            <div class="val" style="transform: rotate(337.5deg)">X1</div>
        </div>
    </div>

    <div class="ui-bottom">
        <button class="btn btn-spin" onclick="spin()">ÇARKTI ÇEVİR (-50K)</button>
        <button class="btn btn-ads" onclick="ads()">📺 REKLAM İZLE (+100K)</button>
    </div>

    <script>
        let balance = 950000;
        let rot = 0;
        const rewards = [5, 3, 10, 0, 1, 15, 10, 1];

        function spin() {
            if(balance < 50000) return alert("Bakiye bitti!");
            balance -= 50000;
            update();
            let target = Math.floor(Math.random() * 8);
            rot += (360 * 5) + (360 - (target * 45 + 22.5));
            document.getElementById('wheel').style.transform = `rotate(${rot}deg)`;
            setTimeout(() => {
                let win = 50000 * rewards[target];
                balance += win;
                update();
                if(rewards[target] > 0) alert("Tebrikler! " + win.toLocaleString() + " kazandın.");
            }, 5100);
        }

        function ads() {
            if(!window.Adsgram) return alert("Reklam yüklenemedi.");
            const AdController = window.Adsgram.init({ blockId: "22286" });
            AdController.show().then(() => { balance += 100000; update(); });
        }

        function update() { document.getElementById('chips').innerText = balance.toLocaleString(); }
    </script>
</body>
</html>
