<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Titan Casino - Ultimate Design</title>
    <script src="https://sad.adsgram.ai/js/adstg.js"></script>
    <style>
        :root { --gold: #FFD700; --blue: #00d2ff; --dark: #050a12; }
        
        body { 
            background: radial-gradient(circle at center, #0a192f 0%, #000 100%);
            color: white; font-family: 'Segoe UI', sans-serif; margin: 0; overflow: hidden;
            display: flex; flex-direction: column; align-items: center;
        }

        /* ÜST PANEL */
        .top-nav {
            width: 100%; background: rgba(0,0,0,0.9); padding: 12px 0;
            border-bottom: 2px solid var(--gold); text-align: center;
        }
        .stats-grid { display: flex; justify-content: center; gap: 20px; font-size: 1.2em; font-weight: bold; }
        .vip-banner { 
            margin-top: 5px; color: var(--gold); font-size: 0.8em; 
            text-transform: uppercase; letter-spacing: 2px;
        }

        /* TİTAN MEKANİZMASI (DİŞLİ ÇARKLAR) */
        .titan-engine {
            position: relative; width: 360px; height: 360px; margin: 25px auto;
            border-radius: 50%;
            /* Dişli çark efekti */
            box-shadow: 0 0 0 15px #1a1a1a, 0 0 0 25px #222, 0 0 50px rgba(0,210,255,0.2);
        }

        /* ALTIN OK */
        .golden-arrow {
            position: absolute; top: -30px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 22px solid transparent; border-right: 22px solid transparent;
            border-top: 50px solid var(--gold); z-index: 100;
            filter: drop-shadow(0 0 15px var(--gold));
        }

        #wheel { 
            width: 320px; height: 320px; border-radius: 50%; border: 10px solid #333;
            position: absolute; top: 10px; left: 10px;
            background: conic-gradient(
                #8b0000 0deg 45deg, #111 45deg 90deg, #8b0000 90deg 135deg, #111 135deg 180deg,
                #8b0000 180deg 225deg, #111 225deg 270deg, #8b0000 270deg 315deg, #111 315deg 360deg
            );
            transition: transform 5s cubic-bezier(0.15, 0, 0.15, 1);
        }

        .x-text {
            position: absolute; width: 60px; top: 35px; left: calc(50% - 30px);
            font-weight: 900; font-size: 1.6em; color: var(--gold);
            text-shadow: 2px 2px 4px #000; transform-origin: center 125px; text-align: center;
        }

        /* BUTONLAR */
        .btns { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .btn {
            width: 85%; padding: 18px; border-radius: 12px; font-weight: 900;
            font-size: 1.2em; border: none; cursor: pointer; text-transform: uppercase;
        }
        .btn-spin { background: linear-gradient(180deg, #FFD700, #B8860B); color: #000; box-shadow: 0 4px 15px rgba(218,165,32,0.5); }
        .btn-ads { background: linear-gradient(180deg, #00d2ff, #3a7bd5); color: #fff; box-shadow: 0 4px 15px rgba(0,210,255,0.5); }
    </style>
</head>
<body>

    <div class="top-nav">
        <div class="stats-grid">
            <span>💰 <span id="bal">250.000</span></span>
            <span style="color:var(--blue)">💎 10</span>
        </div>
        <div class="vip-banner">👑 VIP ÜRETİM: 10.000 ÇİP / SN</div>
    </div>

    <div class="titan-engine">
        <div class="golden-arrow"></div>
        <div id="wheel">
            <div class="x-text" style="transform: rotate(22.5deg)">X10</div>
            <div class="x-text" style="transform: rotate(67.5deg)">X5</div>
            <div class="x-text" style="transform: rotate(112.5deg)">X3</div>
            <div class="x-text" style="transform: rotate(157.5deg)">X10</div>
            <div class="x-text" style="transform: rotate(202.5deg)">X0</div>
            <div class="x-text" style="transform: rotate(247.5deg)">X20</div>
            <div class="x-text" style="transform: rotate(292.5deg)">X1</div>
            <div class="x-text" style="transform: rotate(337.5deg)">X15</div>
        </div>
    </div>

    <div class="btns">
        <button class="btn btn-spin" onclick="startSpin()">ÇARKTI ÇEVİR (-50K)</button>
        <button class="btn btn-ads" onclick="showAd()">📺 REKLAM İZLE (+100K)</button>
    </div>

    <script>
        let balance = 250000;
        let rot = 0;
        const prizeMap = [10, 5, 3, 10, 0, 20, 1, 15];

        function startSpin() {
            if(balance < 50000) return alert("Yetersiz bakiye!");
            balance -= 50000;
            updateUI();

            let idx = Math.floor(Math.random() * 8);
            let stopAt = (idx * 45) + 22.5; 
            rot += (360 * 5) + (360 - stopAt); 
            
            document.getElementById('wheel').style.transform = `rotate(${rot}deg)`;

            setTimeout(() => {
                let win = 50000 * prizeMap[idx];
                balance += win;
                updateUI();
                alert(prizeMap[idx] > 0 ? "TİTAN GÜCÜ! " + win.toLocaleString() + " Kazandın!" : "KAYBETTİN!");
            }, 5100);
        }

        function showAd() {
            if (!window.Adsgram) return alert("Lütfen GitHub linkinizden girin.");
            const AdController = window.Adsgram.init({ blockId: "22286" });
            AdController.show().then(() => {
                balance += 100000;
                updateUI();
            });
        }

        function updateUI() {
            document.getElementById('bal').innerText = balance.toLocaleString();
        }
    </script>
</body>
</html>
