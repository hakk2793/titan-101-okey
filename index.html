<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titan 101 Okey - Professional Edition</title>
    <style>
        :root { --gold: #FFD700; --blue: #00BFFF; --bg: #0b0f19; --card-bg: #161b28; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        /* ÜST PANEL */
        .top-bar { display: flex; justify-content: space-between; padding: 15px; background: rgba(0,0,0,0.8); border-bottom: 2px solid var(--gold); }
        .stat-box { background: rgba(255,255,255,0.1); padding: 5px 15px; border-radius: 20px; border: 1px solid var(--gold); display: flex; align-items: center; gap: 8px; }

        /* ODA SEÇİMİ (FOTOĞRAFTAKİ GİBİ) */
        .room-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; margin-top: 20px; }
        .room-card { background: var(--card-bg); border: 2px solid #333; border-radius: 15px; padding: 20px; text-align: center; position: relative; transition: 0.3s; cursor: pointer; }
        .room-card:hover { border-color: var(--gold); transform: translateY(-5px); }
        .room-card.vip { border-color: #ff007f; }
        .badge { position: absolute; top: -10px; right: -5px; background: #ff007f; padding: 3px 10px; border-radius: 8px; font-size: 12px; }
        .entry-fee { color: #39FF14; font-weight: bold; font-size: 1.2em; }

        /* MARKET MODAL */
        #market-ui { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; display: none; flex-direction: column; }
        .market-header { display: flex; background: #1a237e; padding: 15px; }
        .market-tab { padding: 10px 30px; cursor: pointer; border-bottom: 3px solid transparent; }
        .market-tab.active { border-color: var(--gold); background: rgba(255,255,255,0.1); }
        .market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; padding: 20px; overflow-y: auto; }
        .item-card { background: #252a34; padding: 15px; border-radius: 10px; text-align: center; border: 1px solid #444; }

        .btn-buy { background: #39FF14; color: black; border: none; padding: 8px; width: 100%; border-radius: 5px; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .btn-close { background: #ff3d00; color: white; border: none; padding: 15px; width: 100%; font-weight: bold; }
    </style>
</head>
<body>

    <div id="lobby">
        <div class="top-bar">
            <div class="stat-box">💰 <span id="chips">260K</span></div>
            <div class="stat-box">💎 <span id="diamonds">10</span></div>
            <div class="stat-box" onclick="toggleMarket()" style="cursor:pointer">🛒 MARKET</div>
        </div>

        <div class="room-container">
            <div class="room-card" onclick="startLoading()">
                <span class="badge" style="background:#ff3d00">Yeni</span>
                <h3>Acemi</h3>
                <p class="entry-fee">20K</p>
            </div>
            <div class="room-card">
                <span class="badge" style="background:#00BFFF">Popüler</span>
                <h3>Kalfa</h3>
                <p class="entry-fee">100K</p>
            </div>
            <div class="room-card vip">
                <span class="badge">VIP</span>
                <h3>Usta</h3>
                <p class="entry-fee">500K</p>
            </div>
            <div class="room-card">
                <span class="badge" style="background:#FFD700">Kral</span>
                <h3>Efsane</h3>
                <p class="entry-fee">2.0M</p>
            </div>
        </div>

        <div style="text-align:center; margin-top: 30px;">
            <button onclick="startLoading()" style="background:#39FF14; padding: 20px 80px; border-radius: 50px; font-size: 1.5em; border:none; font-weight:bold; cursor:pointer; box-shadow: 0 0 20px #39FF14;">HIZLI BAŞLAT</button>
        </div>
    </div>

    <div id="market-ui">
        <div class="market-header">
            <div class="market-tab active">ÇİP</div>
            <div class="market-tab">ELMAS</div>
            <div class="market-tab">ÜRÜN</div>
            <div class="market-tab">KUPON</div>
        </div>
        <div class="market-grid">
            <div class="item-card"><h4>5M Çip</h4><p>49.99 TL</p><button class="btn-buy">AL</button></div>
            <div class="item-card"><h4>20M Çip</h4><p>149.99 TL</p><button class="btn-buy">AL</button></div>
            <div class="item-card"><h4>100M Çip</h4><p>499.99 TL</p><button class="btn-buy">AL</button></div>
            <div class="item-card" style="border-color:var(--blue)"><h4>10 Elmas</h4><p>REKLAM</p><button class="btn-buy" style="background:var(--blue)">İZLE</button></div>
        </div>
        <button class="btn-close" onclick="toggleMarket()">KAPAT</button>
    </div>

    <script>
        function toggleMarket() {
            const m = document.getElementById('market-ui');
            m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
        }

        function startLoading() {
            alert("Odaya bağlanılıyor... Lütfen bekleyin.");
            // Burada gerçek oyun sahnesine (Phaser motoruna) geçiş yapılacak
        }
    </script>
</body>
</html>
