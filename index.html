<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>101 Titanik - Mekanik Sürüm</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary-blue: #003366; --secondary-gold: #FFD700; --button-blue: #1976D2; --button-green: #388E3C; --dark-bg: #001a33; --text-color: #FFFFFF; }
        body { margin: 0; overflow: hidden; font-family: 'Open Sans', sans-serif; color: var(--text-color); background-color: var(--dark-bg); }
        .full-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background-size: cover; background-position: center; transition: all 0.5s ease-in-out; z-index: 100; }
        .hidden { display: none !important; }

        /* SPLASH */
        #splash-screen { background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://i.hizliresim.com/6j0f47e.jpg'); }
        .splash-title { font-family: 'Cinzel Decorative', serif; font-size: 3.5em; color: var(--secondary-gold); text-shadow: 0 0 20px #000; }
        .login-buttons button { background: rgba(255,255,255,0.1); border: 2px solid var(--secondary-gold); color: #fff; padding: 12px 30px; margin: 10px; border-radius: 50px; cursor: pointer; font-weight: bold; width: 250px; }

        /* LOBBY */
        #lobby-screen { background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://i.hizliresim.com/t1h521d.jpg'); justify-content: flex-start; padding-top: 20px; }
        .lobby-header { width: 95%; display: flex; justify-content: space-between; background: rgba(0,0,0,0.8); padding: 12px; border-radius: 15px; border: 1px solid var(--secondary-gold); margin-bottom: 15px; }
        .room-selection-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; width: 95%; overflow-y: auto; padding: 10px; }
        .room-card { background: linear-gradient(145deg, #1a2a3a, #0a1a2a); border: 2px solid var(--secondary-gold); border-radius: 15px; padding: 15px; text-align: center; cursor: pointer; position: relative; }
        .room-badge { position: absolute; top: -10px; right: -10px; background: #e91e63; padding: 4px 8px; border-radius: 8px; font-size: 0.7em; }

        /* MARKET */
        #market-screen { background: rgba(0,0,0,0.9); z-index: 500; }
        .market-content { width: 90%; height: 85%; background: #000; border: 2px solid var(--secondary-gold); border-radius: 20px; display: flex; overflow: hidden; }
        .market-nav { width: 130px; background: #111; border-right: 1px solid #333; }
        .market-nav button { width: 100%; padding: 20px 10px; background: none; border: none; color: #fff; border-bottom: 1px solid #222; cursor: pointer; }
        .market-nav button.active { background: var(--button-blue); color: var(--secondary-gold); }
        .market-main { flex-grow: 1; padding: 20px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 15px; }
        .market-item { background: #1a2a3a; padding: 15px; border-radius: 10px; text-align: center; border: 1px solid #333; }

        /* GAME TABLE */
        #game-table { background: radial-gradient(circle, #004d4d, #001a1a); }
        .board-area { width: 95%; height: 50%; display: grid; grid-template-columns: repeat(11, 1fr); background: rgba(0,0,0,0.3); border: 2px solid #006666; border-radius: 10px; }
        .istaka { width: 98%; height: 110px; background: #2b1d0e; border: 4px solid #4a3219; border-radius: 10px; display: flex; flex-wrap: wrap; gap: 4px; padding: 5px; margin-top: 10px; }
        .tas { width: 35px; height: 50px; background: #fdfdfd; color: #000; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.1em; box-shadow: 2px 2px 5px #000; }
        .game-controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; width: 95%; margin-top: 10px; }
        .game-controls button { padding: 12px; border-radius: 5px; border: none; background: var(--button-blue); color: #fff; font-weight: bold; }

        /* DAILY BONUS */
        #daily-bonus-screen { background: rgba(0,0,0,0.95); z-index: 1000; }
        .bonus-box { background: #1a2a3a; border: 3px solid var(--secondary-gold); padding: 30px; border-radius: 20px; text-align: center; }
    </style>
</head>
<body>

    <div id="splash-screen" class="full-screen">
        <h1 class="splash-title">101 TİTANİK</h1>
        <div class="login-buttons">
            <button onclick="loginWith('guest')">MİSAFİR GİRİŞİ</button>
            <button onclick="loginWith('fb')" style="border-color:#4267B2">FACEBOOK GİRİŞİ</button>
        </div>
    </div>

    <div id="lobby-screen" class="full-screen hidden">
        <div class="lobby-header">
            <span>💰 <span id="chips">250.000</span></span>
            <span>💎 <span id="diamonds">17</span></span>
            <span onclick="showScreen('market-screen')" style="cursor:pointer">🛒 MARKET</span>
        </div>
        <div class="room-selection-container" id="room-list"></div>
        <button onclick="alert('Hızlı Masa Aranıyor...')" style="background:var(--button-green); color:white; padding:15px 40px; border:none; border-radius:50px; margin-top:20px; font-weight:bold;">🚀 HIZLI BAŞLAT</button>
    </div>

    <div id="market-screen" class="full-screen hidden">
        <div class="market-content">
            <div class="market-nav">
                <button class="active">ÇİP</button>
                <button onclick="reklamIzle()">📽️ REKLAM</button>
                <button onclick="showScreen('lobby-screen')" style="background:#600">KAPAT</button>
            </div>
            <div class="market-main">
                <div class="market-item"><h4>5M Çip</h4><p>49.99 TL</p><button>SATIN AL</button></div>
                <div class="market-item"><h4>20M Çip</h4><p>149.99 TL</p><button>SATIN AL</button></div>
                <div class="market-item"><h4>100M Çip</h4><p>499.99 TL</p><button>SATIN AL</button></div>
            </div>
        </div>
    </div>

    <div id="daily-bonus-screen" class="full-screen hidden">
        <div class="bonus-box">
            <h2 style="color:var(--secondary-gold)">GÜNLÜK HEDİYE</h2>
            <h1 style="font-size:3em">+10.000 💰</h1>
            <button onclick="collectBonus()" style="background:var(--button-green); color:white; padding:15px 40px; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">AL VE DEVAM ET</button>
        </div>
    </div>

    <div id="game-table" class="full-screen hidden">
        <div class="lobby-header">
            <span onclick="showScreen('lobby-screen')">🔙 ÇIK</span>
            <span id="active-room">Acemi Odası</span>
            <span>💰 <span id="game-chips">250K</span></span>
        </div>
        <div class="board-area" id="board"></div>
        <div class="game-controls">
            <button onclick="alert('Taş Çekildi')">TAŞ AL</button>
            <button onclick="alert('Hile Savar: Eliniz 101 değil!')">SERİ AÇ</button>
            <button onclick="alert('Taş Atıldı')">TAŞ AT</button>
            <button onclick="alert('Çiftler Kontrol Ediliyor...')">ÇİFT AÇ</button>
            <button onclick="dagit()">DİZ</button>
            <button style="background:#600">CEZA</button>
        </div>
        <div class="istaka" id="istaka"></div>
    </div>

    <script>
        let currentChips = 250000;
        const rooms = [
            {n: 'Acemi', b: 20000, badge: 'Yeni'},
            {n: 'Kalfa', b: 100000, badge: 'Popüler'},
            {n: 'Usta', b: 500000, badge: 'VIP'},
            {n: 'Efsane', b: 2000000, badge: 'Kral'}
        ];

        function showScreen(id) {
            document.querySelectorAll('.full-screen').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function loginWith(m) { showScreen('daily-bonus-screen'); }

        function collectBonus() {
            currentChips += 10000;
            updateUI();
            showScreen('lobby-screen');
            loadRooms();
        }

        function loadRooms() {
            const container = document.getElementById('room-list');
            container.innerHTML = '';
            rooms.forEach(r => {
                container.innerHTML += `
                    <div class="room-card" onclick="joinGame('${r.n}', ${r.b})">
                        <span class="room-badge">${r.badge}</span>
                        <h3>${r.n}</h3>
                        <p style="color:#0f0; font-weight:bold">${r.b.toLocaleString()}</p>
                    </div>`;
            });
        }

        function joinGame(name, bet) {
            if(currentChips < bet) return alert("Çip Yetersiz!");
            document.getElementById('active-room').innerText = name + " Odası";
            showScreen('game-table');
            dagit();
            const b = document.getElementById('board');
            b.innerHTML = '';
            for(let i=0; i<77; i++) b.innerHTML += '<div style="border:0.1px solid #111"></div>';
        }

        function dagit() {
            const ist = document.getElementById('istaka');
            ist.innerHTML = '';
            const colors = ['#d32f2f', '#1976d2', '#212121', '#f57c00'];
            for(let i=0; i<22; i++) {
                let n = Math.floor(Math.random()*13)+1;
                let c = colors[Math.floor(Math.random()*4)];
                ist.innerHTML += `<div class="tas" style="color:${c}">${n}</div>`;
            }
        }

        function reklamIzle() {
            alert("📽️ Reklam izlendi! +5000 Çip.");
            currentChips += 5000;
            updateUI();
        }

        function updateUI() {
            document.getElementById('chips').innerText = currentChips.toLocaleString();
            document.getElementById('game-chips').innerText = currentChips.toLocaleString();
        }

        document.addEventListener('DOMContentLoaded', () => { showScreen('splash-screen'); });
    </script>
</body>
</html>
